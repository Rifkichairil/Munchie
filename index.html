<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Munchie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#FFF8EC;
  --card:#FFFFFF;
  --ink:#2B2118;
  --ink-soft:#6B5C4E;
  --chili:#C0392B;
  --chili-dark:#8E271C;
  --turmeric:#F4B400;
  --leaf:#2D5F3E;
  --leaf-light:#E4F1E8;
  --line:#EEE0CC;
  --radius:14px;
  --shadow:0 4px 14px rgba(43,33,24,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#DCC9A8;border-radius:8px}

/* ---- App shell ---- */
#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{
  background:linear-gradient(135deg,var(--chili) 0%,var(--chili-dark) 100%);
  color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:8px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.brand .logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand .title{font-family:'Baloo 2';font-weight:800;font-size:19px;line-height:1}
.brand .sub{font-size:11px;opacity:.85}
.session-box{display:flex;align-items:center;gap:10px;font-size:13px}
.session-box .badge{
  background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;font-weight:700;
  text-transform:uppercase;font-size:10px;letter-spacing:.5px;
}
.logout-btn{background:rgba(0,0,0,.2);color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.logout-btn:hover{background:rgba(0,0,0,.32)}

.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;position:sticky;top:60px;z-index:35}
.tab-btn{
  padding:12px 14px;font-weight:700;font-size:13.5px;color:var(--ink-soft);
  border-bottom:3px solid transparent;white-space:nowrap;background:transparent;
}
.tab-btn.active{color:var(--chili);border-bottom-color:var(--chili)}
.tab-btn:hover{color:var(--chili-dark)}

main{flex:1;padding:16px;max-width:1400px;margin:0 auto;width:100%}

/* ---- Cards / general ---- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.grid-2{display:grid;grid-template-columns:1fr 380px;gap:16px}
@media (max-width:920px){.grid-2{grid-template-columns:1fr}}

.section-title{font-family:'Baloo 2';font-weight:700;font-size:20px;margin:0 0 12px;color:var(--chili-dark)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{
  padding:8px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);
  font-weight:700;font-size:13px;color:var(--ink-soft);
}
.pill.active{background:var(--chili);border-color:var(--chili);color:#fff}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod-card{
  background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;
  transition:transform .08s, border-color .08s;position:relative;
}
.prod-card:hover{border-color:var(--turmeric);transform:translateY(-2px)}
.prod-card:disabled{opacity:.45;cursor:not-allowed;transform:none}
.prod-emoji{font-size:26px}
.prod-name{font-weight:700;font-size:13.5px;margin-top:6px;line-height:1.2}
.prod-price{color:var(--chili);font-weight:800;font-size:13px;margin-top:4px}
.prod-stock{font-size:11px;color:var(--ink-soft);margin-top:2px}
.stock-low{color:var(--chili) !important;font-weight:700}

/* cart */
.cart-panel{display:flex;flex-direction:column;height:calc(100vh - 160px);position:sticky;top:110px}
.cart-list{flex:1;overflow-y:auto;margin:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.cart-item{padding:10px 2px;border-bottom:1px solid #F5EBDA;display:flex;justify-content:space-between;gap:8px}
.cart-item:last-child{border-bottom:none}
.cart-item .name{font-weight:700;font-size:13.5px}
.cart-item .meta{font-size:11.5px;color:var(--ink-soft)}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty-btn{width:22px;height:22px;border-radius:6px;background:var(--leaf-light);color:var(--leaf);font-weight:800}
.cart-total-row{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:8px 0}
.btn{
  padding:11px 16px;border-radius:10px;font-weight:800;font-size:14px;width:100%;
}
.btn-primary{background:var(--chili);color:#fff}
.btn-primary:hover{background:var(--chili-dark)}
.btn-primary:disabled{background:#DCCFC0;cursor:not-allowed}
.btn-secondary{background:var(--leaf-light);color:var(--leaf)}
.btn-outline{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn-sm{padding:6px 10px;font-size:12px;width:auto;border-radius:8px}
.remove-x{color:var(--chili);font-weight:800;background:none;font-size:16px;padding:2px 6px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,33,24,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 4px;font-family:'Baloo 2'}
.opt-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F5EBDA}
.opt-row label{flex:1;font-size:13.5px;font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:8px;font-size:14px;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--turmeric)}

.dropdown{position:relative}
.dropdown-toggle{
  width:100%;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:8px;
  font-size:14px;background:#fff;display:flex;justify-content:space-between;align-items:center;
  color:var(--ink);font-family:inherit;
}
.dropdown-toggle:hover{border-color:var(--turmeric)}
.dropdown-toggle .caret{font-size:11px;color:var(--ink-soft);margin-left:8px}
.dropdown-menu{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
  border:2px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(43,33,24,.18);
  max-height:220px;overflow-y:auto;z-index:200;
}
.dropdown-item{padding:10px 12px;font-size:13.5px;cursor:pointer}
.dropdown-item:hover{background:#FFF3E0}
.dropdown-item.selected{background:var(--leaf-light);font-weight:700;color:var(--leaf)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 6px;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;border-bottom:2px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid #F5EBDA}
tr:hover td{background:#FFFBF3}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow);border-left:5px solid var(--turmeric)}
.stat-card .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase}
.stat-card .val{font-family:'Baloo 2';font-size:22px;font-weight:800;color:var(--chili-dark);margin-top:2px}

.badge-tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800}
.tag-active{background:#FDEAEA;color:var(--chili)}
.tag-ended{background:#EEE;color:#888}
.tag-ok{background:var(--leaf-light);color:var(--leaf)}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, #F9E4C8 0%, transparent 45%),
  radial-gradient(circle at 80% 80%, #F6D9C4 0%, transparent 45%), var(--bg);
  padding:20px;}
.login-card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(43,33,24,.15);padding:32px;max-width:380px;width:100%}
.login-logo{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto 12px;box-shadow:0 6px 18px rgba(192,57,43,.35)}
.login-logo img{width:100%;height:100%;object-fit:cover;display:block}

.notif-banner{background:#FDEAEA;border:2px solid var(--chili);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer-chip{font-family:'Baloo 2';font-weight:700}

@media print{
  @page{ size: 58mm auto; margin: 0; }
  body.print-mode > *{display:none !important}
  body.print-mode #printArea{display:block !important;position:fixed;top:0;left:0;width:58mm;margin:0;padding:2mm;}
}
#printArea{display:none;font-family:'Courier New',monospace;font-size:11px;line-height:1.4;padding:10px;width:58mm}
#printArea .center{text-align:center}
#printArea hr{border:none;border-top:1px dashed #000}
#printArea .row{display:flex;justify-content:space-between}
</style>
</head>

/* ============ STORAGE HELPERS ============ */
const SHARED = true;
async function dbGet(key, fallback){
  try{
    const r = await window.storage.get(key, SHARED);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function dbSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), SHARED); }catch(e){ console.error('storage set failed', e); }
}

/* ============ UTIL ============ */
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const uid = p => p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate = d => new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const fmtTime = d => new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const fmtDateTime = d => fmtDate(d)+' '+fmtTime(d);
const todayStr = () => new Date().toISOString().slice(0,10);

/* ---- custom dropdown (replaces native <select> for reliability inside the artifact frame) ---- */
function dropdownHtml(id, options, selectedValue){
  const sel = options.find(o=>String(o.value)===String(selectedValue)) || options[0] || {value:'',label:'Pilih...'};
  return `
  <div class="dropdown" id="${id}" data-value="${sel.value}">
    <button type="button" class="dropdown-toggle" data-dd-toggle="${id}">
      <span data-dd-label="${id}">${sel.label}</span><span class="caret">▾</span>
    </button>
    <div class="dropdown-menu" id="${id}_menu" style="display:none">
      ${options.map(o=>`<div class="dropdown-item ${String(o.value)===String(sel.value)?'selected':''}" data-dd-item="${id}" data-val="${o.value}">${o.label}</div>`).join('')}
    </div>
  </div>`;
}
function initDropdown(id, onChange){
  const root = document.getElementById(id);
  if(!root) return;
  const toggle = document.querySelector(`[data-dd-toggle="${id}"]`);
  const menu = document.getElementById(id+'_menu');
  if(!toggle||!menu) return;
  toggle.onclick = (e)=>{
    e.stopPropagation();
    document.querySelectorAll('.dropdown-menu').forEach(m=>{ if(m!==menu) m.style.display='none'; });
    menu.style.display = (menu.style.display==='none'||!menu.style.display) ? 'block' : 'none';
  };
  root.querySelectorAll(`[data-dd-item="${id}"]`).forEach(item=>{
    item.onclick = (e)=>{
      e.stopPropagation();
      const val = item.dataset.val;
      root.dataset.value = val;
      const lbl = document.querySelector(`[data-dd-label="${id}"]`);
      if(lbl) lbl.textContent = item.textContent;
      root.querySelectorAll('.dropdown-item').forEach(x=>x.classList.remove('selected'));
      item.classList.add('selected');
      menu.style.display='none';
      if(onChange) onChange(val);
    };
  });
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes=[880,1175];
    notes.forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(ctx.destination);
      const t=ctx.currentTime + i*0.18;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}

async function loadDB(){
  const empty = await dbGet('meta_seeded', false);
  if(!empty){
    seedDefaults();
    await saveAll();
    await dbSet('meta_seeded', true);
  } else {
    DB.products = await dbGet('products', []);
    DB.flavorGroups = await dbGet('flavorGroups', null);
    DB.ingredients = await dbGet('ingredients', null);
    DB.customers = await dbGet('customers', []);
    DB.rentals = await dbGet('rentals', []);
    DB.transactions = await dbGet('transactions', []);
    DB.staff = await dbGet('staff', []);
    DB.attendance = await dbGet('attendance', []);
    DB.shifts = await dbGet('shifts', []);
    DB.cashFlows = await dbGet('cashFlows', []);
  }
  await runMigrations();
}
async function runMigrations(){
  let changed = false;
  if(!DB.flavorGroups){
    DB.flavorGroups = defaultFlavorGroups();
    changed = true;
  }
  const defaults = defaultFlavorGroups();
  ['cimol','cilok','cuanki'].forEach(cat=>{
    if(!DB.flavorGroups[cat]) { DB.flavorGroups[cat] = defaults[cat]; changed = true; }
  });
  if(!DB.products.some(p=>p.category==='cuanki')){
    DB.products.push(
      {id:uid('p'),name:'Cuanki',category:'cuanki',price:14000,cogs:6000,stock:40,unit:'porsi',customizable:true},
      {id:uid('p'),name:'Baso Aci (Baci)',category:'cuanki',price:13000,cogs:5500,stock:40,unit:'porsi',customizable:true}
    );
    changed = true;
  }
  if(!DB.ingredients){
    DB.ingredients = defaultIngredients();
    changed = true;
  }
  DB.products.forEach(p=>{ if(!p.recipe){ p.recipe = []; changed = true; } });
  if(changed) await saveAll();
}

  await Promise.all([
    dbSet('products', DB.products),

    dbSet('ingredients', DB.ingredients),

/* ============ SHIFT / BUKA-TUTUP KASIR ============ */
const COMMISSION_PER_CUP = 1000;
const WEEKDAY_CUP_THRESHOLD = 20;
const WEEKEND_CUP_THRESHOLD = 70;

function getActiveShift(username){
  return DB.shifts.find(s=>s.username===username && s.status==='open');
}
function shiftTransactions(shiftId){
  return DB.transactions.filter(t=>t.shiftId===shiftId);
}
function shiftCashFlows(shiftId){
  return DB.cashFlows.filter(c=>c.shiftId===shiftId);
}
function computeShiftRecap(shift){
  const txs = shiftTransactions(shift.id);
  const totalRevenue = txs.reduce((s,t)=>s+t.total,0);
  const totalCash = txs.filter(t=>t.payment==='cash').reduce((s,t)=>s+t.total,0);
  const totalQris = txs.filter(t=>t.payment==='qris').reduce((s,t)=>s+t.total,0);
  let cupsSold = 0;
  txs.forEach(t=> t.items.forEach(it=>{ if(it.category==='minuman') cupsSold += it.qty; }));
  const flows = shiftCashFlows(shift.id);
  const kasMasuk = flows.filter(c=>c.type==='in').reduce((s,c)=>s+c.amount,0);
  const kasKeluar = flows.filter(c=>c.type==='out').reduce((s,c)=>s+c.amount,0);
  return { txCount:txs.length, totalRevenue, totalCash, totalQris, cupsSold, kasMasuk, kasKeluar };
}
function isWeekend(dateMs){
  const day = new Date(dateMs).getDay();
  return day===0 || day===6;
}
function computeShiftCommission(shift, cupsSold){
  if(!isWeekend(shift.openTime)){
    return cupsSold > WEEKDAY_CUP_THRESHOLD ? cupsSold * COMMISSION_PER_CUP : 0;
  } else {
    const otherSameDayCups = DB.shifts
      .filter(s=> s.username===shift.username && s.date===shift.date && s.status==='closed' && s.id!==shift.id)
      .reduce((sum,s)=> sum+(s.cupsSold||0), 0);
    const dayTotal = otherSameDayCups + cupsSold;
    return dayTotal > WEEKEND_CUP_THRESHOLD ? cupsSold * COMMISSION_PER_CUP : 0;
  }
}

  const openBtn = document.getElementById('openShiftBtn');

  document.querySelectorAll('[data-pid]').forEach(b=> b.onclick=()=>{

    if(!p) return;
    if(p.category==='sewa'){ openRentalModal(p); return; }
    if(p.customizable){ openCustomizeModal(p); return; }

  });

      if(act==='rm'){ STATE.cart.splice(i,1); }
      else if(act==='inc'){ bumpQty(i,1); }
      else if(act==='dec'){ bumpQty(i,-1); }
      renderTabContent();
    };
  });
  const chk = document.getElementById('checkoutBtn');
  if(chk) chk.onclick = ()=> openCheckoutModal();
  const clr = document.getElementById('clearCartBtn');
  if(clr) clr.onclick = ()=>{ STATE.cart=[]; renderTabContent(); };
}
function bumpQty(i,delta){
  const item = STATE.cart[i];
  const p = DB.products.find(x=>x.id===item.productId);
  const newQty = item.qty+delta;
  if(newQty<1){ STATE.cart.splice(i,1); return; }
  if(p && p.category!=='sewa' && newQty>p.stock+item.qty){ /* rough guard, real check on checkout */ }
  item.qty = newQty;
  item.subtotal = item.unitPrice*item.qty;
}

  else if(STATE.modal.type==='checkout') inner = renderCheckoutModal();
  else if(STATE.modal.type==='receipt') inner = renderReceiptModal();
  else if(STATE.modal.type==='staffForm') inner = renderStaffFormModal();
  else if(STATE.modal.type==='productForm') inner = renderProductFormModal();
  else if(STATE.modal.type==='customerForm') inner = renderCustomerFormModal();
  else if(STATE.modal.type==='shiftOpen') inner = renderShiftOpenModal();
  else if(STATE.modal.type==='shiftClose') inner = renderShiftCloseModal();
  else if(STATE.modal.type==='flavorItemForm') inner = renderFlavorItemFormModal();
  else if(STATE.modal.type==='ingredientForm') inner = renderIngredientFormModal();
  overlayHtml.innerHTML = `<div class="modal">${inner}</div>`;
  document.body.appendChild(overlayHtml);
  overlayHtml.addEventListener('click', e=>{ if(e.target.id==='modalOverlay'){ STATE.modal=null; closeModalDom(); }});
  attachModalEvents();
}
function closeModalDom(){ const o=document.getElementById('modalOverlay'); if(o) o.remove(); }

function sauceCharge(group, sauceIds){
  if(!sauceIds.length) return 0;
  return (sauceIds.length-1) * (group.sauceExtraFee||0);
}
function addonCharge(group, addonIds){
  return addonIds.reduce((sum,id)=>{
    const a = group.addons.find(x=>x.id===id);
    return sum + (a? a.price : 0);
  }, 0);
}

function attachModalEvents(){
  const cancel = document.getElementById('cancelModal');
  if(cancel) cancel.onclick = ()=>{ STATE.modal=null; closeModalDom(); };

  if(STATE.modal.type==='customize'){
    document.querySelectorAll('[name="bumbu"]').forEach(r=> r.onchange=()=>{ STATE.modal.data.bumbuId=r.value; });
    document.querySelectorAll('.sauceChk').forEach(c=> c.onchange=()=>{
      const set = new Set(STATE.modal.data.sauceIds);
      if(c.checked) set.add(c.value); else set.delete(c.value);
      STATE.modal.data.sauceIds = [...set];
      closeModalDom(); renderModal();
    });
    document.querySelectorAll('.addonChk').forEach(c=> c.onchange=()=>{
      const set = new Set(STATE.modal.data.addonIds);
      if(c.checked) set.add(c.value); else set.delete(c.value);
      STATE.modal.data.addonIds = [...set];
      closeModalDom(); renderModal();
    });
    document.getElementById('addCustomToCart').onclick = ()=>{
      const qty = Math.max(1, +document.getElementById('customQty').value || 1);
      const {product,bumbuId,sauceIds,addonIds} = STATE.modal.data;
      const group = DB.flavorGroups[product.category] || {bumbuMode:'none', bumbu:[], addons:[]};
      const bumbu = group.bumbuMode==='single' ? group.bumbu.find(b=>b.id===bumbuId) : null;
      const sauceObjs = sauceIds.map(id=>group.bumbu.find(b=>b.id===id)).filter(Boolean);
      const addonObjs = addonIds.map(id=>group.addons.find(a=>a.id===id)).filter(Boolean);
      const unitPrice = product.price + sauceCharge(group,sauceIds) + addonCharge(group,addonIds);
      const parts = [];
      if(bumbu) parts.push(`${group.bumbuLabel}: ${bumbu.name}`);
      if(sauceObjs.length) parts.push(`${group.bumbuLabel}: `+sauceObjs.map((s,idx)=> idx===0? `${s.name} (gratis)` : `${s.name} (+${rp(group.sauceExtraFee)})`).join(', '));
      if(addonObjs.length) parts.push(`${group.addonLabel}: `+addonObjs.map(a=>`${a.name} (+${rp(a.price)})`).join(', '));
      addToCart({
        productId:product.id, name:product.name, qty, unitPrice,
        meta: parts.join(' · '),
        subtotal:unitPrice*qty, bumbuId: bumbu?bumbuId:'', sauceIds, addonIds
      });
      STATE.modal=null; closeModalDom(); renderTabContent();
    };
  }
  if(STATE.modal.type==='rental'){
    initDropdown('rentCustomerDD', (val)=>{
      const c = DB.customers.find(x=>x.id===val);
      if(c){ document.getElementById('rentName').value=c.name; document.getElementById('rentPhone').value=c.phone; STATE.modal.data.customerId=c.id; }
      else STATE.modal.data.customerId='';
    });
    const hoursInput = document.getElementById('rentHours');
    hoursInput.oninput = ()=>{
      const h = Math.max(1, +hoursInput.value||1);
      document.getElementById('rentTotalLabel').textContent = rp(STATE.modal.data.product.price*h);
    };
    document.getElementById('addRentalToCart').onclick = ()=>{
      const product = STATE.modal.data.product;
      const name = document.getElementById('rentName').value.trim();
      const phone = document.getElementById('rentPhone').value.trim();
      const hours = Math.max(1, +document.getElementById('rentHours').value||1);
      if(!name || !phone){ alert('Nama dan No. WhatsApp wajib diisi untuk sewa tikar.'); return; }
      addToCart({
        productId:product.id, name:'Sewa Tikar Piknik ('+hours+' jam)', qty:1,
        unitPrice: product.price*hours, subtotal: product.price*hours,
        meta:`Penyewa: ${name} — ${phone}`,
        isRental:true, hours, customerId: STATE.modal.data.customerId||'', custName:name, custPhone:phone
      });
      STATE.modal=null; closeModalDom(); renderTabContent();
    };
  }
  if(STATE.modal.type==='checkout'){

        id: uid('sh'), username: STATE.session.username, name: STATE.session.name,
        date: todayStr(), openTime: Date.now(), closeTime: null, openingCash,
        closingCashCounted: null, status:'open',
        totalRevenue:0, totalCash:0, totalQris:0, txCount:0, cupsSold:0, commission:0, cashVariance:0,
        attendanceId: null
      };
      // buka kasir sekaligus jadi absen masuk (khusus staff)
      if(STATE.session.role==='staff'){

    const shift = STATE.modal.data.shift;

    const diffInput = document.getElementById('closingCashInput');
    const updateDiff = ()=>{
      const counted = +diffInput.value||0;
      const diff = counted-expected;
      const lbl = document.getElementById('cashDiffLabel');
      if(counted>0){
        lbl.textContent = (diff===0?'Kas pas, sesuai ekspektasi.':(diff>0? 'Kelebihan kas: '+rp(diff) : 'Kekurangan kas: '+rp(Math.abs(diff))));

    diffInput.oninput = ()=>{ STATE.modal.data.closingCashCounted=diffInput.value; updateDiff(); };

      const closeTime = Date.now();
      Object.assign(shift, {

        txCount: finalRecap.txCount, cupsSold: finalRecap.cupsSold, commission,
        kasMasuk: finalRecap.kasMasuk, kasKeluar: finalRecap.kasKeluar,
        cashVariance: counted-(shift.openingCash+finalRecap.totalCash+finalRecap.kasMasuk-finalRecap.kasKeluar)
      });
      // tutup kasir sekaligus jadi absen pulang (khusus staff)
      if(STATE.session.role==='staff'){
        let att = shift.attendanceId ? DB.attendance.find(a=>a.id===shift.attendanceId) : null;
        if(!att) att = DB.attendance.find(a=>a.username===shift.username && a.date===shift.date && !a.clockOut);
        if(att){ att.clockOut = closeTime; }
        await save('attendance');
      }
      await save('shifts');
      STATE.modal=null; closeModalDom(); renderTabContent();
    };
  }
}

/* ---- checkout finalize ---- */
async function finalizeCheckout(){
  const shift = getActiveShift(STATE.session.username);
  const isOwner = STATE.session.role==='owner';
  if(!isOwner && !shift){ alert('Kasir belum dibuka. Buka kasir terlebih dahulu.'); STATE.modal=null; closeModalDom(); renderTabContent(); return; }
  const method = STATE.modal.data.method;
  const total = cartTotal();
  if(method==='cash'){
    const given = +STATE.modal.data.cashGiven||0;
    if(given < total){ alert('Uang diterima kurang dari total.'); return; }
  }
  // decrement stock
  for(const item of STATE.cart){
    const p = DB.products.find(x=>x.id===item.productId);
    if(p){ p.stock = Math.max(0, p.stock - (item.isRental?1:item.qty)); }
    const group = p ? (DB.flavorGroups[p.category]||null) : null;
    if(group){
      if(item.bumbuId){ const b=group.bumbu.find(x=>x.id===item.bumbuId); if(b) b.stock=Math.max(0,b.stock-item.qty); }
      if(item.sauceIds){ item.sauceIds.forEach(id=>{ const b=group.bumbu.find(x=>x.id===id); if(b) b.stock=Math.max(0,b.stock-item.qty); }); }
      if(item.addonIds){ item.addonIds.forEach(id=>{ const a=group.addons.find(x=>x.id===id); if(a) a.stock=Math.max(0,a.stock-item.qty); }); }
    }
    if(p && p.recipe && p.recipe.length){
      const soldQty = item.isRental ? 1 : item.qty;
      p.recipe.forEach(r=>{
        const ing = DB.ingredients.find(x=>x.id===r.ingredientId);
        if(ing) ing.stock = Math.max(0, ing.stock - (r.qty * soldQty));
      });
    }
  }
  const cogsTotal = STATE.cart.reduce((s,item)=>{
    const p = DB.products.find(x=>x.id===item.productId);
    return s + (p? p.cogs*(item.isRental?1:item.qty) : 0);
  },0);
  const given = method==='cash' ? (+STATE.modal.data.cashGiven||0) : total;
  const transaction = {
    id: uid('TRX').toUpperCase(), timestamp: Date.now(), cashier: STATE.session.name,
    cashierUsername: STATE.session.username, shiftId: shift ? shift.id : null,
    items: STATE.cart.map(c=>{
      const p = DB.products.find(x=>x.id===c.productId);
      return {name:c.name,qty:c.qty,price:c.unitPrice,subtotal:c.subtotal,meta:c.meta,category:p?p.category:'', productId:c.productId};
    }),
    total, payment: method, change: method==='cash'? given-total : 0, cogsTotal
  };
  DB.transactions.push(transaction);

  // create rentals
  for(const item of STATE.cart){
    if(item.isRental){
      let custId = item.customerId;
      if(!custId){
        const newCust = {id:uid('cu'), name:item.custName, phone:item.custPhone, notes:''};
        DB.customers.push(newCust);
        custId = newCust.id;
      }
      DB.rentals.push({
        id: uid('rt'), customerId: custId, customerName:item.custName, phone:item.custPhone,
        hours:item.hours, startTime: Date.now(), endTime: Date.now()+item.hours*3600*1000,
        status:'active', notified:false, mat: item.name
      });
    }
  }

  await saveAll();
  if(method==='qris') playBeep();
  STATE.cart = [];
  STATE.modal = {type:'receipt', data:{transaction}};
  closeModalDom(); render();
  doPrintReceipt(transaction);
}

/* ============ PRINTING: ESC/POS + BLUETOOTH + FALLBACK ============ */
const ESC = 0x1B, GS = 0x1D;
function escCmd(...bytes){ return new Uint8Array(bytes); }
function escText(s){ return new TextEncoder().encode(s); }
function escConcat(parts){
  const total = parts.reduce((s,p)=>s+p.length, 0);
  const out = new Uint8Array(total);
  let off = 0;
  for(const p of parts){ out.set(p, off); off += p.length; }
  return out;
}

function buildEscposReceipt(t){
  const W = 36; // chars per line for 58mm (Font A: 12dots/char × 36 = 432dots ≈ 54mm)
  const SEP = '-'.repeat(W);
  const p = []; // parts array
  const raw = s => p.push(escText(s));
  const cmd = (...b) => p.push(escCmd(...b));
  const line = (l,r) => {
    const gap = Math.max(1, W - l.length - r.length);
    raw(l + ' '.repeat(gap) + r + '\n');
  };
  // Init
  cmd(ESC, 0x40); // ESC @ – initialize

  // Header – center, double size, bold
  cmd(ESC, 0x61, 1);   // center
  cmd(ESC, 0x21, 0x30); // double H + double W
  cmd(ESC, 0x45, 1);    // bold
  raw('MUNCHIE\n');
  cmd(ESC, 0x21, 0x00); // normal
  cmd(ESC, 0x45, 0);    // bold off
  raw('bites . drinks . treats\n');
  raw(fmtDateTime(t.timestamp) + '\n');

  // Info
  cmd(ESC, 0x61, 0); // left align
  raw(SEP + '\n');
  raw('No  : ' + t.id + '\n');
  raw('Kasir: ' + t.cashier + '\n');
  raw(SEP + '\n');

  // Items
  t.items.forEach(it => {
    const left = it.qty + 'x ' + it.name;
    const right = rp(it.subtotal);
    line(left, right);
    if(it.meta){
      // Word-wrap meta: prefer breaking at · or , before breaking at space
      const wrapW = W - 2;
      let rem = it.meta;
      while(rem.length > 0){
        if(rem.length <= wrapW){
          raw('  ' + rem + '\n');
          break;
        }
        // Priority: break at · (group separator), then , (item separator), then space
        let cut = wrapW;
        const bullet = rem.lastIndexOf('· ', wrapW); // ·
        const comma  = rem.lastIndexOf(', ', wrapW);
        const space  = rem.lastIndexOf(' ', wrapW);
        if(bullet > wrapW / 2) cut = bullet + 1; // break after ·
        else if(comma > wrapW / 2) cut = comma + 1; // break after ,
        else if(space > wrapW / 2) cut = space;
        raw('  ' + rem.slice(0, cut).trimEnd() + '\n');
        rem = rem.slice(cut).trimStart();
      }
    }
  });

  raw(SEP + '\n');

  // Total – bold
  cmd(ESC, 0x45, 1);
  line('TOTAL', rp(t.total));
  cmd(ESC, 0x45, 0);

  // Payment
  const payMethod = t.payment.toUpperCase();
  const payAmt = t.payment === 'cash' ? rp(t.total + t.change) : rp(t.total);
  line('Bayar (' + payMethod + ')', payAmt);
  if(t.payment === 'cash'){
    line('Kembali', rp(t.change));
  }

  raw(SEP + '\n');

  // Footer – center
  cmd(ESC, 0x61, 1);
  raw('Terima kasih!\n');
  raw('\n\n\n\n\n\n'); // 6 line feeds for tear-off space
  cmd(GS, 0x56, 1); // GS V 1 – partial cut (most compatible)

  return escConcat(p);
}

async function printViaBluetooth(t){
  if(!navigator.bluetooth) throw new Error('Bluetooth not available');

  // Common SPP UUIDs for thermal printers
  const SPP_SERVICE = '00001101-0000-1000-8000-00805f9b34fb';
  const WRITE_CHAR  = '00002af1-0000-1000-8000-00805f9b34fb';

  const device = await navigator.bluetooth.requestDevice({
    acceptAllDevices: true,
    optionalServices: [SPP_SERVICE]
  });

  const server = await device.gatt.connect();
  let service, characteristic;

  // Try SPP service first, fallback to first available
  try {
    service = await server.getPrimaryService(SPP_SERVICE);
  } catch(e){
    // Some printers don't expose SPP UUID; try to get any service
    const services = await server.getPrimaryServices();
    if(!services.length) throw new Error('No GATT services found on printer');
    service = services[0];
  }

  // Find writable characteristic
  const chars = await service.getCharacteristics();
  characteristic = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
  if(!characteristic) throw new Error('No writable characteristic found on printer');

  const data = buildEscposReceipt(t);
  const CHUNK = 20; // minimum BLE packet size — most reliable across all printers
  const delay = ms => new Promise(r => setTimeout(r, ms));

  console.log('ESC/POS sending', data.byteLength, 'bytes in', Math.ceil(data.byteLength/CHUNK), 'chunks');

  // Send with conservative pacing for low-buffer BLE printers
  let sent = 0;
  for(let i = 0; i < data.byteLength; i += CHUNK){
    const chunk = data.slice(i, Math.min(i + CHUNK, data.byteLength));
    try {
      await characteristic.writeValueWithResponse(chunk);
    } catch(e){
      // Fallback to unacknowledged write, but log warning
      console.warn('writeValueWithResponse failed at byte', i, '- falling back to writeWithoutResponse');
      await characteristic.writeValueWithoutResponse(chunk);
    }
    sent += chunk.byteLength;
    await delay(120);
  }

  console.log('All', sent, 'bytes sent, waiting for printer...');

  // Long pause to let printer finish processing before disconnect
  await delay(1200);
  await device.gatt.disconnect();
  return true;
}

function renderReceiptToCanvas(t){
  const W = 230; // ~58mm in px
  const scale = 2; // retina
  const font = '12px monospace';
  const boldFont = 'bold 12px monospace';
  const bigFont = 'bold 16px monospace';
  const lineH = 20;
  const pad = 12;

  // Temp context for text measurement
  const tmp = document.createElement('canvas').getContext('2d');
  tmp.font = font;

  // Count lines a word-wrapped meta text will take
  function countMetaLines(text){
    const maxW = W - pad * 2 - 12; // 12px indent
    const words = text.split(' ');
    let cur = '', count = 0;
    for(const w of words){
      const test = cur ? cur + ' ' + w : w;
      if(tmp.measureText(test).width > maxW && cur){
        count++;
        cur = w;
      } else {
        cur = test;
      }
    }
    if(cur) count++;
    return count;
  }

  // Calculate total height
  let lines = 0;
  lines += 2; // header (big + normal)
  lines += 1; // sub
  lines += 1; // date
  lines += 1; // sep
  lines += 2; // no, kasir
  lines += 1; // sep
  t.items.forEach(it => {
    lines += 1; // item row
    if(it.meta) lines += countMetaLines(it.meta);
  });
  lines += 1; // sep
  lines += 1; // total
  lines += 1; // bayar
  if(t.payment==='cash') lines += 1; // kembali
  lines += 1; // sep
  lines += 1; // thanks
  lines += 2; // feed + cut margin

  const H = lines * lineH + pad * 2;

  // Draw
  const canvas = document.createElement('canvas');
  canvas.width = W * scale;
  canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.font = font;
  ctx.textBaseline = 'top';

  let y = pad;

  const drawLine = (text, opts={}) => {
    if(opts.center){
      ctx.textAlign = 'center';
      ctx.fillText(text, W/2, y);
      ctx.textAlign = 'left';
    } else {
      ctx.fillText(text, pad, y);
    }
    y += lineH;
  };
  const drawRow = (l, r) => {
    ctx.textAlign = 'left';
    ctx.fillText(l, pad, y);
    ctx.textAlign = 'right';
    ctx.fillText(r, W - pad, y);
    ctx.textAlign = 'left';
    y += lineH;
  };
  const drawSep = () => {
    const sepY = y + lineH/2;
    ctx.beginPath();
    ctx.setLineDash([4, 4]);
    ctx.moveTo(pad, sepY);
    ctx.lineTo(W - pad, sepY);
    ctx.stroke();
    ctx.setLineDash([]);
    y += lineH;
  };

  // Header
  ctx.font = bigFont;
  drawLine('MUNCHIE', {center:true});
  ctx.font = font;
  drawLine('bites . drinks . treats', {center:true});
  drawLine(fmtDateTime(t.timestamp), {center:true});
  drawSep();
  drawLine('No  : ' + t.id);
  drawLine('Kasir: ' + t.cashier);
  drawSep();

  // Items
  t.items.forEach(it => {
    drawRow(it.qty + 'x ' + it.name, rp(it.subtotal));
    if(it.meta){
      const maxW = W - pad * 2 - 12;
      const words = it.meta.split(' ');
      let curLine = '';
      for(const word of words){
        const test = curLine ? curLine + ' ' + word : word;
        if(ctx.measureText(test).width > maxW && curLine){
          drawLine('  ' + curLine);
          curLine = word;
        } else {
          curLine = test;
        }
      }
      if(curLine) drawLine('  ' + curLine);
    }
  });
  drawSep();

  // Total
  ctx.font = boldFont;
  drawRow('TOTAL', rp(t.total));
  ctx.font = font;

  // Payment
  const payAmt = t.payment==='cash' ? rp(t.total + t.change) : rp(t.total);
  drawRow('Bayar (' + t.payment.toUpperCase() + ')', payAmt);
  if(t.payment==='cash') drawRow('Kembali', rp(t.change));
  drawSep();

  // Footer
  drawLine('Terima kasih!', {center:true});

  return canvas;
}

async function shareReceiptImage(t, fallbackPrint){
  try {
    const canvas = renderReceiptToCanvas(t);
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));

    // Try Web Share API (mobile)
    if(navigator.share && navigator.canShare){
      const file = new File([blob], 'struk-'+t.id+'.png', {type:'image/png'});
      const shareData = { title:'Struk Munchie', files:[file] };
      if(navigator.canShare(shareData)){
        await navigator.share(shareData);
        return;
      }
      // Fallback: share just the URL/text
      await navigator.share({ title:'Struk Munchie', text:'Struk '+t.id+' - Total: '+rp(t.total) });
      return;
    }
  } catch(e){
    // User cancelled share or share not available
    if(e && e.name === 'AbortError') return; // user cancelled, not an error
  }
  // Desktop / last resort: popup + window.print()
  if(fallbackPrint) fallbackPrint();
}

async function doPrintReceipt(t){
  const content = `
    <div class="center"><strong>MUNCHIE</strong><br>bites &middot; drinks &middot; treats<br>${fmtDateTime(t.timestamp)}</div>
    <hr>
    <div>No: ${t.id}<br>Kasir: ${t.cashier}</div>
    <hr>
    ${t.items.map(it=>`<div class="row"><span>${it.qty}x ${it.name}</span><span>${rp(it.subtotal)}</span></div>${it.meta?`<div style="font-size:10px">${it.meta}</div>`:''}`).join('')}
    <hr>
    <div class="row"><strong>TOTAL</strong><strong>${rp(t.total)}</strong></div>
    <div class="row"><span>Bayar (${t.payment.toUpperCase()})</span><span>${t.payment==='cash'?rp(t.total+t.change):rp(t.total)}</span></div>
    ${t.payment==='cash'?`<div class="row"><span>Kembali</span><span>${rp(t.change)}</span></div>`:''}
    <hr>
    <div class="center">Terima kasih! 🌶️</div>
  `;

  // Popup fallback function (desktop / last resort)
  const popupPrint = () => {
    const w = window.open('', '_printReceipt', 'width=226,height=400,left=100,top=100');
    if(!w){
      const area = document.getElementById('printArea');
      area.innerHTML = content;
      document.body.classList.add('print-mode');
      window.print();
      setTimeout(()=> document.body.classList.remove('print-mode'), 500);
      return;
    }
    w.document.write(`<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Struk Munchie</title>
<style>
  @page{size:58mm 120mm;margin:0}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:58mm;margin:0;padding:2mm;font-family:'Courier New',monospace;font-size:11px;line-height:1.35;color:#000;background:#fff;overflow:hidden}
  .center{text-align:center}
  hr{border:none;border-top:1px dashed #000;margin:3px 0}
  .row{display:flex;justify-content:space-between}
  @media print{
    @page{size:58mm 120mm;margin:0}
    html,body{width:58mm;margin:0;padding:2mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style></head>
<body>${content}</body></html>`);
    w.document.close();
    w.focus();
    setTimeout(()=>{
      w.print();
      w.onafterprint = ()=>{ w.close(); };
      setTimeout(()=>{ try{w.close();}catch(e){} }, 120000);
    }, 300);
  };

  // 1. Try Bluetooth ESC/POS (Android Chrome)
  if(navigator.bluetooth){
    try {
      await printViaBluetooth(t);
      return; // success, done
    } catch(e){
      console.warn('Bluetooth print failed, falling back:', e.message);
    }
  }

  // 2. Try share image (iOS / mobile)
  await shareReceiptImage(t, popupPrint);
}

/* ============ SEWA & PELANGGAN ============ */
function renderSewa(){
  const now = Date.now();
  const activeRentals = DB.rentals.filter(r=>r.status==='active');
  const dueRentals = activeRentals.filter(r=> r.endTime<=now && !r.notified);
  const notifBanner = dueRentals.map(r=>`
    <div class="notif-banner">
      <div><strong>⏰ Waktu sewa ${r.customerName} sudah habis!</strong><br>
      <span style="font-size:12px">${r.mat} — selesai ${fmtTime(r.endTime)}</span></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-primary" data-wa="${r.id}">📲 Kirim Pengingat WA</button>
        <button class="btn btn-sm btn-outline" data-return="${r.id}">Tandai Selesai</button>
      </div>
    </div>`).join('');

  const rentalRows = activeRentals.map(r=>{
    const remain = r.endTime-now;
    const overdue = remain<=0;
    const mins = Math.floor(Math.abs(remain)/60000);
    const h=Math.floor(mins/60), m=mins%60;
    return `<tr>
      <td>${r.customerName}<br><span style="font-size:11px;color:var(--ink-soft)">${r.phone}</span></td>
      <td>${r.mat}</td>
      <td>${fmtTime(r.startTime)} - ${fmtTime(r.endTime)}</td>
      <td><span class="timer-chip" style="color:${overdue?'var(--chili)':'var(--leaf)'}">${overdue?'Lewat ':''}${h}j ${m}m</span></td>
      <td><span class="badge-tag ${overdue?'tag-active':'tag-ok'}">${overdue?'Waktu Habis':'Berjalan'}</span></td>
      <td><button class="btn btn-sm btn-outline" data-return="${r.id}">Selesai</button></td>
    </tr>`;
  }).join('');

  const custRows = DB.customers.map(c=>`
    <tr><td>${c.name}</td><td>${c.phone}</td><td>${c.notes||'—'}</td>
    <td>${DB.rentals.filter(r=>r.customerId===c.id).length}x sewa</td></tr>`).join('');

  return `
  <h2 class="section-title">Sewa Tikar &amp; Pelanggan</h2>
  ${notifBanner}
  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-top:0">Sewa Aktif</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Penyewa</th><th>Item</th><th>Jam</th><th>Sisa Waktu</th><th>Status</th><th></th></tr></thead>
      <tbody>${rentalRows || '<tr><td colspan="6" style="color:var(--ink-soft)">Belum ada sewa aktif.</td></tr>'}</tbody>
    </table></div>
    <p style="font-size:11px;color:var(--ink-soft);margin-top:10px">Catatan: pengiriman WhatsApp otomatis penuh memerlukan WhatsApp Business API berbayar dan server backend. Di sini, klik "Kirim Pengingat WA" untuk membuka chat WhatsApp dengan pesan siap kirim (satu klik).</p>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Database Pelanggan</h3>
      <button class="btn btn-sm btn-primary" id="addCustomerBtn">+ Tambah Pelanggan</button>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Nama</th><th>No. WA</th><th>Catatan</th><th>Riwayat</th></tr></thead>
      <tbody>${custRows || '<tr><td colspan="4" style="color:var(--ink-soft)">Belum ada pelanggan.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}
function attachSewaEvents(){
  document.querySelectorAll('[data-wa]').forEach(b=> b.onclick=()=>{
    const r = DB.rentals.find(x=>x.id===b.dataset.wa);
    const phone = r.phone.replace(/^0/,'62').replace(/[^0-9]/g,'');
    const msg = encodeURIComponent(`Halo ${r.customerName}, waktu sewa ${r.mat} Anda di Munchie sudah berakhir pukul ${fmtTime(r.endTime)}. Mohon segera dikembalikan ya, terima kasih! 🙏`);

      <thead><tr><th>Waktu</th><th>Tipe</th><th>Kategori</th><th>Keterangan</th><th>Jumlah</th><th>Oleh</th></tr></thead>
      <tbody>${visibleFlows.map(c=>`<tr>
        <td>${fmtDateTime(c.timestamp)}</td>
        <td><span class="badge-tag ${c.type==='in'?'tag-ok':'tag-active'}">${c.type==='in'?'Masuk':'Keluar'}</span></td>
        <td>${c.category}</td><td>${c.note||'—'}</td>

function attachKasEvents(){

  const saveBtn = document.getElementById('saveKasBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const category = getDropdownValue('kasCatDD');
    const amount = +document.getElementById('kasAmount').value||0;
    const note = document.getElementById('kasNote').value.trim();
    if(amount<=0){ alert('Jumlah harus lebih dari 0.'); return; }
    const shift = getActiveShift(STATE.session.username);
    DB.cashFlows.push({
      id: uid('cf'), type: STATE.kasType, category, amount, note,
      timestamp: Date.now(), username: STATE.session.username, name: STATE.session.name,
      shiftId: shift? shift.id : null
    });
    await save('cashFlows');
    renderTabContent();
  };
}

/* ============ ABSEN ============ */
function renderAbsen(){
  const today = todayStr();
  const mine = DB.attendance.filter(a=>a.username===STATE.session.username).sort((a,b)=>b.date.localeCompare(a.date));
  const todayRec = mine.find(a=>a.date===today);
  const staffInfo = DB.staff.find(s=>s.username===STATE.session.username);
  const rows = mine.slice(0,14).map(a=>{
    const hrs = a.clockOut ? ((a.clockOut-a.clockIn)/3600000) : 0;
    const pay = hrs*staffInfo.hourlyRate;
    return `<tr><td>${fmtDate(a.date)}</td><td>${a.clockIn?fmtTime(a.clockIn):'—'}</td><td>${a.clockOut?fmtTime(a.clockOut):'—'}</td>
      <td>${a.clockOut? hrs.toFixed(1)+' jam':'sedang bertugas'}</td><td>${a.clockOut? rp(pay):'—'}</td></tr>`;
  }).join('');
  const myShifts = DB.shifts.filter(s=>s.username===STATE.session.username && s.status==='closed').sort((a,b)=>b.closeTime-a.closeTime).slice(0,14);
  return `

  <div class="stat-grid">
    <div class="stat-card"><div class="lbl">Status Hari Ini</div><div class="val" style="font-size:16px">${todayRec ? (todayRec.clockOut? 'Sudah Pulang':'Sedang Bertugas') : 'Belum Absen'}</div></div>
    <div class="stat-card"><div class="lbl">Jam Masuk</div><div class="val" style="font-size:16px">${todayRec?fmtTime(todayRec.clockIn):'—'}</div></div>
    <div class="stat-card"><div class="lbl">Upah / Jam</div><div class="val" style="font-size:16px">${rp(staffInfo.hourlyRate)}</div></div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <p style="font-size:13px;color:var(--ink-soft);margin:0">🔗 Absen sekarang otomatis mengikuti buka/tutup kasir di tab <strong>Kasir</strong> — buka kasir = absen masuk, tutup kasir = absen pulang. Tidak perlu absen manual lagi di sini.</p>
    ${!todayRec ? `<p style="margin:10px 0 0;font-weight:700;color:var(--chili)">Kamu belum absen hari ini — buka kasir dulu di tab Kasir.</p>` :
      !todayRec.clockOut ? `<p style="margin:10px 0 0;font-weight:700;color:var(--leaf)">🟢 Sedang bertugas sejak ${fmtTime(todayRec.clockIn)}.</p>` :
      `<p style="margin:10px 0 0;color:var(--leaf);font-weight:700">✅ Absensi hari ini selesai. Sampai jumpa besok!</p>`}
  </div>
  <div class="card" style="margin-bottom:16px">
    <h3 style="margin-top:0">Riwayat Absensi</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Durasi</th><th>Pendapatan</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="color:var(--ink-soft)">Belum ada riwayat.</td></tr>'}</tbody>
    </table></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">Riwayat Shift Kasir &amp; Komisi</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Tanggal</th><th>Jam</th><th>Cup Terjual</th><th>Komisi</th></tr></thead>
      <tbody>${myShifts.map(s=>`<tr><td>${fmtDate(s.openTime)}</td><td>${fmtTime(s.openTime)}–${fmtTime(s.closeTime)}</td><td>${s.cupsSold}</td><td style="color:${s.commission>0?'var(--leaf)':'inherit'};font-weight:${s.commission>0?'800':'400'}">${rp(s.commission)}</td></tr>`).join('') || '<tr><td colspan="4" style="color:var(--ink-soft)">Belum ada shift ditutup.</td></tr>'}</tbody>
    </table></div>
    <p style="font-size:11px;color:var(--ink-soft);margin-top:8px">Komisi cup minuman: Sen–Jum &gt;${WEEKDAY_CUP_THRESHOLD} cup/shift, Sab–Min &gt;${WEEKEND_CUP_THRESHOLD} cup/hari (gabungan shift) — ${rp(COMMISSION_PER_CUP)}/cup.</p>
  </div>`;
}
function attachAbsenEvents(){
  // absen kini sepenuhnya otomatis lewat buka/tutup kasir; tidak ada aksi manual di tab ini
}

/* ============ LAPORAN (owner) ============ */
let salesChartInstance = null;
function rangeFilterTS(range, ts){
  const now = new Date();
  const d = new Date(ts);
  if(range==='today') return d.toDateString()===now.toDateString();
  if(range==='week'){ const diff=(now-d)/86400000; return diff>=0 && diff<7; }
  if(range==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  return true;
}
function rangeFilter(range){
  return t => rangeFilterTS(range, t.timestamp);
}
function renderLaporan(){
  const filtered = DB.transactions.filter(rangeFilter(STATE.reportRange));
  const revenue = filtered.reduce((s,t)=>s+t.total,0);
  const cost = filtered.reduce((s,t)=>s+t.cogsTotal,0);
  const profit = revenue-cost;
  const txCount = filtered.length;

  const productAgg = {};
  filtered.forEach(t=> t.items.forEach(it=>{ productAgg[it.name]=(productAgg[it.name]||0)+it.qty; }));
  const topProducts = Object.entries(productAgg).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const closedShifts = DB.shifts.filter(s=> s.status==='closed' && rangeFilterTS(STATE.reportRange, s.closeTime));

  const flowsInRange = DB.cashFlows.filter(c=> rangeFilterTS(STATE.reportRange, c.timestamp));
  const kasMasukTotal = flowsInRange.filter(c=>c.type==='in').reduce((s,c)=>s+c.amount,0);
  const kasKeluarTotal = flowsInRange.filter(c=>c.type==='out').reduce((s,c)=>s+c.amount,0);
  const cashSalesInRange = filtered.filter(t=>t.payment==='cash').reduce((s,t)=>s+t.total,0);
  const netCashPosition = cashSalesInRange + kasMasukTotal - kasKeluarTotal;
  const kasKeluarByCat = {};
  flowsInRange.filter(c=>c.type==='out').forEach(c=>{ kasKeluarByCat[c.category]=(kasKeluarByCat[c.category]||0)+c.amount; });

  const staffPay = DB.staff.filter(s=>s.role==='staff').map(s=>{
    const recs = DB.attendance.filter(a=>a.username===s.username && a.clockOut && rangeFilter(STATE.reportRange)({timestamp:a.clockIn}));
    const hrs = recs.reduce((sum,a)=> sum+(a.clockOut-a.clockIn)/3600000,0);
    const komisi = closedShifts.filter(sh=>sh.username===s.username).reduce((sum,sh)=>sum+(sh.commission||0),0);
    return {name:s.name, hrs, pay:hrs*s.hourlyRate, komisi};
  });

  return `
  <h2 class="section-title">Laporan Penjualan</h2>
  <div class="pill-row">
    <button class="pill ${STATE.reportRange==='today'?'active':''}" data-range="today">Hari Ini</button>
    <button class="pill ${STATE.reportRange==='week'?'active':''}" data-range="week">7 Hari Terakhir</button>
    <button class="pill ${STATE.reportRange==='month'?'active':''}" data-range="month">Bulan Ini</button>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="lbl">Total Pendapatan</div><div class="val">${rp(revenue)}</div></div>
    <div class="stat-card"><div class="lbl">Total Modal (COGS)</div><div class="val">${rp(cost)}</div></div>
    <div class="stat-card"><div class="lbl">Estimasi Untung</div><div class="val">${rp(profit)}</div></div>
    <div class="stat-card"><div class="lbl">Jumlah Transaksi</div><div class="val">${txCount}</div></div>
  </div>
  <div class="grid-2" style="grid-template-columns:1.3fr 1fr">
    <div class="card">
      <h3 style="margin-top:0">Produk Terlaris</h3>
      <canvas id="topChart" height="220"></canvas>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Pendapatan &amp; Komisi Staff</h3>
      <table><thead><tr><th>Staff</th><th>Jam</th><th>Gaji</th><th>Komisi</th><th>Total</th></tr></thead>
      <tbody>${staffPay.map(s=>`<tr><td>${s.name}</td><td>${s.hrs.toFixed(1)}</td><td>${rp(s.pay)}</td><td>${rp(s.komisi)}</td><td><strong>${rp(s.pay+s.komisi)}</strong></td></tr>`).join('') || '<tr><td colspan="5" style="color:var(--ink-soft)">Belum ada data.</td></tr>'}</tbody></table>
      <p style="font-size:11px;color:var(--ink-soft);margin-top:8px">Komisi: Sen–Jum &gt;${WEEKDAY_CUP_THRESHOLD} cup/shift, Sab–Min &gt;${WEEKEND_CUP_THRESHOLD} cup/hari — ${rp(COMMISSION_PER_CUP)}/cup.</p>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">Riwayat Buka/Tutup Kasir</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Tanggal</th><th>Kasir</th><th>Jam</th><th>Pendapatan</th><th>Cup</th><th>Komisi</th><th>Selisih Kas</th></tr></thead>
      <tbody>${closedShifts.slice().reverse().map(s=>`<tr>
        <td>${fmtDate(s.openTime)}</td><td>${s.name}</td><td>${fmtTime(s.openTime)}–${fmtTime(s.closeTime)}</td>
        <td>${rp(s.totalRevenue)}</td><td>${s.cupsSold}</td>
        <td style="color:${s.commission>0?'var(--leaf)':'inherit'}">${rp(s.commission)}</td>
        <td style="color:${s.cashVariance===0?'inherit':(s.cashVariance<0?'var(--chili)':'var(--turmeric)')}">${s.cashVariance===0?'Pas':(s.cashVariance>0?'+':'')+rp(s.cashVariance)}</td>
      </tr>`).join('') || '<tr><td colspan="7" style="color:var(--ink-soft)">Belum ada shift ditutup pada rentang ini.</td></tr>'}</tbody>
    </table></div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">💵 Arus Kas (Kas Masuk/Keluar Manual)</h3>
    <div class="stat-grid" style="margin-bottom:10px">
      <div class="stat-card" style="border-left-color:var(--leaf)"><div class="lbl">Total Kas Masuk</div><div class="val" style="color:var(--leaf);font-size:18px">${rp(kasMasukTotal)}</div></div>
      <div class="stat-card" style="border-left-color:var(--chili)"><div class="lbl">Total Kas Keluar</div><div class="val" style="color:var(--chili);font-size:18px">${rp(kasKeluarTotal)}</div></div>
      <div class="stat-card"><div class="lbl">Estimasi Kas Tunai di Laci</div><div class="val" style="font-size:18px">${rp(netCashPosition)}</div></div>
    </div>
    <p style="font-size:11px;color:var(--ink-soft);margin:0 0 10px">Estimasi kas tunai = penjualan tunai + kas masuk manual − kas keluar manual (belum termasuk kas awal shift yang sedang berjalan).</p>
    ${Object.keys(kasKeluarByCat).length? `
    <h4 style="margin:10px 0 6px;font-size:13px">Rincian Kas Keluar per Kategori</h4>
    <table><thead><tr><th>Kategori</th><th>Jumlah</th></tr></thead>
    <tbody>${Object.entries(kasKeluarByCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`<tr><td>${cat}</td><td>${rp(amt)}</td></tr>`).join('')}</tbody></table>`:''}
    <h4 style="margin:14px 0 6px;font-size:13px">Transaksi Kas Terbaru</h4>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Waktu</th><th>Tipe</th><th>Kategori</th><th>Keterangan</th><th>Jumlah</th><th>Oleh</th></tr></thead>
      <tbody>${flowsInRange.slice().reverse().slice(0,15).map(c=>`<tr>
        <td>${fmtDateTime(c.timestamp)}</td>
        <td><span class="badge-tag ${c.type==='in'?'tag-ok':'tag-active'}">${c.type==='in'?'Masuk':'Keluar'}</span></td>
        <td>${c.category}</td><td>${c.note||'—'}</td>
        <td style="color:${c.type==='in'?'var(--leaf)':'var(--chili)'};font-weight:700">${c.type==='in'?'+':'-'}${rp(c.amount)}</td>
        <td>${c.name}</td>
      </tr>`).join('') || '<tr><td colspan="6" style="color:var(--ink-soft)">Belum ada catatan kas pada rentang ini.</td></tr>'}</tbody>
    </table></div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">Transaksi Terbaru</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>No.</th><th>Waktu</th><th>Kasir</th><th>Metode</th><th>Total</th></tr></thead>
      <tbody>${filtered.slice().reverse().slice(0,20).map(t=>`<tr><td>${t.id}</td><td>${fmtDateTime(t.timestamp)}</td><td>${t.cashier}</td><td>${t.payment.toUpperCase()}</td><td>${rp(t.total)}</td></tr>`).join('') || '<tr><td colspan="5" style="color:var(--ink-soft)">Belum ada transaksi.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}
function attachLaporanEvents(){
  document.querySelectorAll('[data-range]').forEach(b=> b.onclick=()=>{ STATE.reportRange=b.dataset.range; renderTabContent(); });
  const ctx = document.getElementById('topChart');
  if(ctx){
    const filtered = DB.transactions.filter(rangeFilter(STATE.reportRange));
    const productAgg = {};
    filtered.forEach(t=> t.items.forEach(it=>{ productAgg[it.name]=(productAgg[it.name]||0)+it.qty; }));
    const top = Object.entries(productAgg).sort((a,b)=>b[1]-a[1]).slice(0,6);
    if(salesChartInstance) salesChartInstance.destroy();
    salesChartInstance = new Chart(ctx, {
      type:'bar',
      data:{ labels: top.map(x=>x[0]), datasets:[{ label:'Terjual', data: top.map(x=>x[1]), backgroundColor:'#C0392B', borderRadius:6 }] },
      options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0}}} }
    });
  }
}

/* ============ STAFF (owner) ============ */
function renderStaff(){
  const rows = DB.staff.map(s=>`
    <tr><td>${s.name}</td><td>${s.username}</td><td>${s.role}</td><td>${rp(s.hourlyRate)}</td>
    <td style="white-space:nowrap">
      <button class="btn btn-sm btn-outline" data-editstaff="${s.username}">Edit</button>
      ${s.username!==STATE.session.username? `<button class="btn btn-sm btn-outline" data-delstaff="${s.username}">Hapus</button>`:''}
    </td></tr>`).join('');
  return `
  <h2 class="section-title">Manajemen Staff</h2>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Daftar Staff</h3>
      <button class="btn btn-sm btn-primary" id="addStaffBtn">+ Tambah Staff</button>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Upah/Jam</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}
function attachStaffEvents(){
  const addBtn = document.getElementById('addStaffBtn');
  if(addBtn) addBtn.onclick = ()=>{ STATE.modal={type:'staffForm',data:{}}; render(); };
  document.querySelectorAll('[data-editstaff]').forEach(b=> b.onclick=()=>{
    const s = DB.staff.find(x=>x.username===b.dataset.editstaff);
    STATE.modal={type:'staffForm',data:{staff:s}}; render();
  });
  document.querySelectorAll('[data-delstaff]').forEach(b=> b.onclick=()=>{
    if(confirm('Hapus staff ini?')){
      DB.staff = DB.staff.filter(s=>s.username!==b.dataset.delstaff);
      save('staff'); renderTabContent();
    }
  });
}

/* ============ AUTO CHECK RENTAL DUE (background) ============ */
setInterval(()=>{
  if(STATE.session && STATE.tab==='sewa'){ renderTabContent(); }
}, 20000);

/* ============ INIT ============ */
(async function init(){
  await loadDB();
  render();
})();
</script>
</body>
</html>
