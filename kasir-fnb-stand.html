<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Munchie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#FFF8EC;
  --card:#FFFFFF;
  --ink:#2B2118;
  --ink-soft:#6B5C4E;
  --chili:#C0392B;
  --chili-dark:#8E271C;
  --turmeric:#F4B400;
  --leaf:#2D5F3E;
  --leaf-light:#E4F1E8;
  --line:#EEE0CC;
  --radius:14px;
  --shadow:0 4px 14px rgba(43,33,24,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
button{font-family:inherit;cursor:pointer;border:none;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#DCC9A8;border-radius:8px}

/* ---- App shell ---- */
#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{
  background:linear-gradient(135deg,var(--chili) 0%,var(--chili-dark) 100%);
  color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:8px;
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.brand .logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand .title{font-family:'Baloo 2';font-weight:800;font-size:19px;line-height:1}
.brand .sub{font-size:11px;opacity:.85}
.session-box{display:flex;align-items:center;gap:10px;font-size:13px}
.session-box .badge{
  background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;font-weight:700;
  text-transform:uppercase;font-size:10px;letter-spacing:.5px;
}
.logout-btn{background:rgba(0,0,0,.2);color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600}
.logout-btn:hover{background:rgba(0,0,0,.32)}

.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto;position:sticky;top:60px;z-index:35}
.tab-btn{
  padding:12px 14px;font-weight:700;font-size:13.5px;color:var(--ink-soft);
  border-bottom:3px solid transparent;white-space:nowrap;background:transparent;
}
.tab-btn.active{color:var(--chili);border-bottom-color:var(--chili)}
.tab-btn:hover{color:var(--chili-dark)}

main{flex:1;padding:16px;max-width:1400px;margin:0 auto;width:100%}

/* ---- Cards / general ---- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.grid-2{display:grid;grid-template-columns:1fr 380px;gap:16px}
@media (max-width:920px){.grid-2{grid-template-columns:1fr}}

.section-title{font-family:'Baloo 2';font-weight:700;font-size:20px;margin:0 0 12px;color:var(--chili-dark)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{
  padding:8px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);
  font-weight:700;font-size:13px;color:var(--ink-soft);
}
.pill.active{background:var(--chili);border-color:var(--chili);color:#fff}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod-card{
  background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;
  transition:transform .08s, border-color .08s;position:relative;
}
.prod-card:hover{border-color:var(--turmeric);transform:translateY(-2px)}
.prod-card:disabled{opacity:.45;cursor:not-allowed;transform:none}
.prod-emoji{font-size:26px}
.prod-name{font-weight:700;font-size:13.5px;margin-top:6px;line-height:1.2}
.prod-price{color:var(--chili);font-weight:800;font-size:13px;margin-top:4px}
.prod-stock{font-size:11px;color:var(--ink-soft);margin-top:2px}
.stock-low{color:var(--chili) !important;font-weight:700}

/* cart */
.cart-panel{display:flex;flex-direction:column;height:calc(100vh - 160px);position:sticky;top:110px}
.cart-list{flex:1;overflow-y:auto;margin:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.cart-item{padding:10px 2px;border-bottom:1px solid #F5EBDA;display:flex;justify-content:space-between;gap:8px}
.cart-item:last-child{border-bottom:none}
.cart-item .name{font-weight:700;font-size:13.5px}
.cart-item .meta{font-size:11.5px;color:var(--ink-soft)}
.qty-ctrl{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty-btn{width:22px;height:22px;border-radius:6px;background:var(--leaf-light);color:var(--leaf);font-weight:800}
.cart-total-row{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:8px 0}
.btn{
  padding:11px 16px;border-radius:10px;font-weight:800;font-size:14px;width:100%;
}
.btn-primary{background:var(--chili);color:#fff}
.btn-primary:hover{background:var(--chili-dark)}
.btn-primary:disabled{background:#DCCFC0;cursor:not-allowed}
.btn-secondary{background:var(--leaf-light);color:var(--leaf)}
.btn-outline{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn-sm{padding:6px 10px;font-size:12px;width:auto;border-radius:8px}
.remove-x{color:var(--chili);font-weight:800;background:none;font-size:16px;padding:2px 6px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(43,33,24,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal{background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 4px;font-family:'Baloo 2'}
.opt-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F5EBDA}
.opt-row label{flex:1;font-size:13.5px;font-weight:600}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:8px;font-size:14px;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--turmeric)}

.dropdown{position:relative}
.dropdown-toggle{
  width:100%;text-align:left;padding:10px 12px;border:2px solid var(--line);border-radius:8px;
  font-size:14px;background:#fff;display:flex;justify-content:space-between;align-items:center;
  color:var(--ink);font-family:inherit;
}
.dropdown-toggle:hover{border-color:var(--turmeric)}
.dropdown-toggle .caret{font-size:11px;color:var(--ink-soft);margin-left:8px}
.dropdown-menu{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
  border:2px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(43,33,24,.18);
  max-height:220px;overflow-y:auto;z-index:200;
}
.dropdown-item{padding:10px 12px;font-size:13.5px;cursor:pointer}
.dropdown-item:hover{background:#FFF3E0}
.dropdown-item.selected{background:var(--leaf-light);font-weight:700;color:var(--leaf)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 6px;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;border-bottom:2px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid #F5EBDA}
tr:hover td{background:#FFFBF3}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow);border-left:5px solid var(--turmeric)}
.stat-card .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase}
.stat-card .val{font-family:'Baloo 2';font-size:22px;font-weight:800;color:var(--chili-dark);margin-top:2px}

.badge-tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800}
.tag-active{background:#FDEAEA;color:var(--chili)}
.tag-ended{background:#EEE;color:#888}
.tag-ok{background:var(--leaf-light);color:var(--leaf)}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 20% 20%, #F9E4C8 0%, transparent 45%),
  radial-gradient(circle at 80% 80%, #F6D9C4 0%, transparent 45%), var(--bg);
  padding:20px;}
.login-card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(43,33,24,.15);padding:32px;max-width:380px;width:100%}
.login-logo{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto 12px;box-shadow:0 6px 18px rgba(192,57,43,.35)}
.login-logo img{width:100%;height:100%;object-fit:cover;display:block}

.notif-banner{background:#FDEAEA;border:2px solid var(--chili);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer-chip{font-family:'Baloo 2';font-weight:700}

@media print{
  body.print-mode > *{display:none !important}
  body.print-mode #printArea{display:block !important;position:fixed;top:0;left:0;width:100%;}
}
#printArea{display:none;font-family:'Courier New',monospace;font-size:12px;padding:10px;width:280px}
#printArea .center{text-align:center}
#printArea hr{border:none;border-top:1px dashed #000}
#printArea .row{display:flex;justify-content:space-between}
</style>
</head>

/* ============ STORAGE HELPERS ============ */
const SHARED = true;
async function dbGet(key, fallback){
  try{
    const r = await window.storage.get(key, SHARED);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function dbSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), SHARED); }catch(e){ console.error('storage set failed', e); }
}

/* ============ UTIL ============ */
const rp = n => 'Rp' + Math.round(n).toLocaleString('id-ID');
const uid = p => p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate = d => new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const fmtTime = d => new Date(d).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const fmtDateTime = d => fmtDate(d)+' '+fmtTime(d);
const todayStr = () => new Date().toISOString().slice(0,10);

/* ---- custom dropdown (replaces native <select> for reliability inside the artifact frame) ---- */
function dropdownHtml(id, options, selectedValue){
  const sel = options.find(o=>String(o.value)===String(selectedValue)) || options[0] || {value:'',label:'Pilih...'};
  return `
  <div class="dropdown" id="${id}" data-value="${sel.value}">
    <button type="button" class="dropdown-toggle" data-dd-toggle="${id}">
      <span data-dd-label="${id}">${sel.label}</span><span class="caret">▾</span>
    </button>
    <div class="dropdown-menu" id="${id}_menu" style="display:none">
      ${options.map(o=>`<div class="dropdown-item ${String(o.value)===String(sel.value)?'selected':''}" data-dd-item="${id}" data-val="${o.value}">${o.label}</div>`).join('')}
    </div>
  </div>`;
}
function initDropdown(id, onChange){
  const root = document.getElementById(id);
  if(!root) return;
  const toggle = document.querySelector(`[data-dd-toggle="${id}"]`);
  const menu = document.getElementById(id+'_menu');
  if(!toggle||!menu) return;
  toggle.onclick = (e)=>{
    e.stopPropagation();
    document.querySelectorAll('.dropdown-menu').forEach(m=>{ if(m!==menu) m.style.display='none'; });
    menu.style.display = (menu.style.display==='none'||!menu.style.display) ? 'block' : 'none';
  };
  root.querySelectorAll(`[data-dd-item="${id}"]`).forEach(item=>{
    item.onclick = (e)=>{
      e.stopPropagation();
      const val = item.dataset.val;
      root.dataset.value = val;
      const lbl = document.querySelector(`[data-dd-label="${id}"]`);
      if(lbl) lbl.textContent = item.textContent;
      root.querySelectorAll('.dropdown-item').forEach(x=>x.classList.remove('selected'));
      item.classList.add('selected');
      menu.style.display='none';
      if(onChange) onChange(val);
    };
  });
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes=[880,1175];
    notes.forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(ctx.destination);
      const t=ctx.currentTime + i*0.18;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}

  document.querySelectorAll('[data-cat]').forEach(b=> b.onclick=()=>{STATE.posCategory=b.dataset.cat; renderTabContent();});
  document.querySelectorAll('[data-pid]').forEach(b=> b.onclick=()=>{
    const p = DB.products.find(x=>x.id===b.dataset.pid);
    if(!p) return;
    if(p.category==='sewa'){ openRentalModal(p); return; }
    if(p.customizable){ openCustomizeModal(p); return; }
    addToCart({productId:p.id,name:p.name,qty:1,unitPrice:p.price,meta:'',subtotal:p.price});
  });
  document.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick = ()=>{
      const i = +b.dataset.i, act=b.dataset.act;
      if(act==='rm'){ STATE.cart.splice(i,1); }
      else if(act==='inc'){ bumpQty(i,1); }
      else if(act==='dec'){ bumpQty(i,-1); }
      renderTabContent();
    };
  });
  const chk = document.getElementById('checkoutBtn');
  if(chk) chk.onclick = ()=> openCheckoutModal();
  const clr = document.getElementById('clearCartBtn');
  if(clr) clr.onclick = ()=>{ STATE.cart=[]; renderTabContent(); };
}
function bumpQty(i,delta){
  const item = STATE.cart[i];
  const p = DB.products.find(x=>x.id===item.productId);
  const newQty = item.qty+delta;
  if(newQty<1){ STATE.cart.splice(i,1); return; }
  if(p && p.category!=='sewa' && newQty>p.stock+item.qty){ /* rough guard, real check on checkout */ }
  item.qty = newQty;
  item.subtotal = item.unitPrice*item.qty;
}

function attachModalEvents(){
  const cancel = document.getElementById('cancelModal');
  if(cancel) cancel.onclick = ()=>{ STATE.modal=null; closeModalDom(); };

  if(STATE.modal.type==='customize'){
    document.querySelectorAll('[name="bumbu"]').forEach(r=> r.onchange=()=>{ STATE.modal.data.bumbuId=r.value; });
    document.querySelectorAll('.toppingChk').forEach(c=> c.onchange=()=>{
      const set = new Set(STATE.modal.data.toppings);
      if(c.checked) set.add(c.value); else set.delete(c.value);
      STATE.modal.data.toppings = [...set];
      closeModalDom(); renderModal();
    });
    document.getElementById('addCustomToCart').onclick = ()=>{
      const qty = Math.max(1, +document.getElementById('customQty').value || 1);
      const {product,bumbuId,toppings} = STATE.modal.data;
      const bumbu = DB.bumbuOptions.find(b=>b.id===bumbuId);
      const topObjs = toppings.map(tid=>DB.toppingOptions.find(t=>t.id===tid)).filter(Boolean);
      const unitPrice = product.price + topObjs.reduce((s,t)=>s+t.price,0);
      addToCart({
        productId:product.id, name:product.name, qty, unitPrice,
        meta:`Bumbu: ${bumbu?bumbu.name:'-'}${topObjs.length?', +'+topObjs.map(t=>t.name).join(', '):''}`,
        subtotal:unitPrice*qty, bumbuId, toppingIds:toppings
      });
      STATE.modal=null; closeModalDom(); renderTabContent();
    };
  }
  if(STATE.modal.type==='rental'){
    initDropdown('rentCustomerDD', (val)=>{
      const c = DB.customers.find(x=>x.id===val);
      if(c){ document.getElementById('rentName').value=c.name; document.getElementById('rentPhone').value=c.phone; STATE.modal.data.customerId=c.id; }
      else STATE.modal.data.customerId='';
    });
    const hoursInput = document.getElementById('rentHours');
    hoursInput.oninput = ()=>{
      const h = Math.max(1, +hoursInput.value||1);
      document.getElementById('rentTotalLabel').textContent = rp(STATE.modal.data.product.price*h);
    };
    document.getElementById('addRentalToCart').onclick = ()=>{
      const product = STATE.modal.data.product;
      const name = document.getElementById('rentName').value.trim();
      const phone = document.getElementById('rentPhone').value.trim();
      const hours = Math.max(1, +document.getElementById('rentHours').value||1);
      if(!name || !phone){ alert('Nama dan No. WhatsApp wajib diisi untuk sewa tikar.'); return; }
      addToCart({
        productId:product.id, name:'Sewa Tikar Piknik ('+hours+' jam)', qty:1,
        unitPrice: product.price*hours, subtotal: product.price*hours,
        meta:`Penyewa: ${name} — ${phone}`,
        isRental:true, hours, customerId: STATE.modal.data.customerId||'', custName:name, custPhone:phone
      });
      STATE.modal=null; closeModalDom(); renderTabContent();
    };
  }
  if(STATE.modal.type==='checkout'){
    document.querySelectorAll('[data-method]').forEach(b=> b.onclick=()=>{
      STATE.modal.data.method=b.dataset.method; closeModalDom(); renderModal();
    });
    const cashInput = document.getElementById('cashGiven');
    if(cashInput){
      const updateChange = ()=>{
        const given = +cashInput.value||0;
        const change = given - cartTotal();
        document.getElementById('changeLabel').textContent = given>0 ? ('Kembalian: '+rp(Math.max(change,0))) : '';
        document.getElementById('changeLabel').style.color = change<0? 'var(--chili)':'var(--leaf)';
      };
      cashInput.oninput = ()=>{ STATE.modal.data.cashGiven=cashInput.value; updateChange(); };
      updateChange();
    }
    document.getElementById('confirmPayBtn').onclick = ()=> finalizeCheckout();
  }
  if(STATE.modal.type==='receipt'){
    document.getElementById('printBtn').onclick = ()=> doPrintReceipt(STATE.modal.data.transaction);
    document.getElementById('closeReceiptBtn').onclick = ()=>{ STATE.modal=null; closeModalDom(); renderTabContent(); };
  }
  if(STATE.modal.type==='staffForm'){
    initDropdown('sfRoleDD');
    document.getElementById('saveStaffBtn').onclick = ()=>{
      const name=document.getElementById('sfName').value.trim();
      const username=document.getElementById('sfUser').value.trim();
      const password=document.getElementById('sfPass').value.trim();
      const role=getDropdownValue('sfRoleDD');
      const hourlyRate=+document.getElementById('sfRate').value||0;
      if(!name||!username||!password){ alert('Lengkapi semua data.'); return; }
      const existing = STATE.modal.data.staff;
      if(existing){
        if(username!==existing.username && DB.staff.some(s=>s.username===username)){ alert('Username sudah dipakai.'); return; }
        Object.assign(existing,{name,password,role,hourlyRate});
        if(existing.username===STATE.session.username){
          STATE.session.name = name; STATE.session.role = role;
        }
      } else {
        if(DB.staff.some(s=>s.username===username)){ alert('Username sudah dipakai.'); return; }
        DB.staff.push({name,username,password,role,hourlyRate});
      }
      save('staff');
      STATE.modal=null; closeModalDom(); render();
    };
  }
  if(STATE.modal.type==='productForm'){
    initDropdown('pfCatDD');
    document.getElementById('saveProductBtn').onclick = ()=>{
      const name=document.getElementById('pfName').value.trim();
      const category=getDropdownValue('pfCatDD');
      const price=+document.getElementById('pfPrice').value||0;
      const cogs=+document.getElementById('pfCogs').value||0;
      const stock=+document.getElementById('pfStock').value||0;
      const unit=document.getElementById('pfUnit').value.trim()||'pcs';
      if(!name){ alert('Nama produk wajib diisi.'); return; }
      const existing = STATE.modal.data.product;
      if(existing){
        Object.assign(existing,{name,category,price,cogs,stock,unit});
      } else {
        DB.products.push({id:uid('p'),name,category,price,cogs,stock,unit,emoji:'🍽️',customizable:(category==='cimol'||category==='cilok')});
      }
      save('products');
      STATE.modal=null; closeModalDom(); renderTabContent();
    };
  }
  if(STATE.modal.type==='customerForm'){
    document.getElementById('saveCustomerBtn').onclick = ()=>{
      const name=document.getElementById('cfName').value.trim();
      const phone=document.getElementById('cfPhone').value.trim();
      const notes=document.getElementById('cfNote').value.trim();
      if(!name||!phone){ alert('Nama dan No. WhatsApp wajib diisi.'); return; }
      DB.customers.push({id:uid('cu'),name,phone,notes});
      save('customers');
      STATE.modal=null; closeModalDom(); renderTabContent();
    };
  }
}

/* ---- checkout finalize ---- */
async function finalizeCheckout(){
  const method = STATE.modal.data.method;
  const total = cartTotal();
  if(method==='cash'){
    const given = +STATE.modal.data.cashGiven||0;
    if(given < total){ alert('Uang diterima kurang dari total.'); return; }
  }
  // decrement stock
  for(const item of STATE.cart){
    const p = DB.products.find(x=>x.id===item.productId);
    if(p){ p.stock = Math.max(0, p.stock - (item.isRental?1:item.qty)); }
    if(item.bumbuId){ const b=DB.bumbuOptions.find(x=>x.id===item.bumbuId); if(b) b.stock=Math.max(0,b.stock-item.qty); }
    if(item.toppingIds){ item.toppingIds.forEach(tid=>{ const t=DB.toppingOptions.find(x=>x.id===tid); if(t) t.stock=Math.max(0,t.stock-item.qty); }); }
  }
  const cogsTotal = STATE.cart.reduce((s,item)=>{
    const p = DB.products.find(x=>x.id===item.productId);
    return s + (p? p.cogs*(item.isRental?1:item.qty) : 0);
  },0);
  const given = method==='cash' ? (+STATE.modal.data.cashGiven||0) : total;
  const transaction = {
    id: uid('TRX').toUpperCase(), timestamp: Date.now(), cashier: STATE.session.name,
    items: STATE.cart.map(c=>({name:c.name,qty:c.qty,price:c.unitPrice,subtotal:c.subtotal,meta:c.meta})),
    total, payment: method, change: method==='cash'? given-total : 0, cogsTotal
  };
  DB.transactions.push(transaction);

  // create rentals
  for(const item of STATE.cart){
    if(item.isRental){
      let custId = item.customerId;
      if(!custId){
        const newCust = {id:uid('cu'), name:item.custName, phone:item.custPhone, notes:''};
        DB.customers.push(newCust);
        custId = newCust.id;
      }
      DB.rentals.push({
        id: uid('rt'), customerId: custId, customerName:item.custName, phone:item.custPhone,
        hours:item.hours, startTime: Date.now(), endTime: Date.now()+item.hours*3600*1000,
        status:'active', notified:false, mat: item.name
      });
    }
  }

  await saveAll();
  if(method==='qris') playBeep();
  STATE.cart = [];
  STATE.modal = {type:'receipt', data:{transaction}};
  closeModalDom(); render();
}

    <hr>

/* ============ LAPORAN (owner) ============ */
let salesChartInstance = null;
function rangeFilter(range){
  const now = new Date();
  return t => {
    const d = new Date(t.timestamp);
    if(range==='today') return d.toDateString()===now.toDateString();
    if(range==='week'){ const diff=(now-d)/86400000; return diff>=0 && diff<7; }
    if(range==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
    return true;
  };
}
function renderLaporan(){
  const filtered = DB.transactions.filter(rangeFilter(STATE.reportRange));
  const revenue = filtered.reduce((s,t)=>s+t.total,0);
  const cost = filtered.reduce((s,t)=>s+t.cogsTotal,0);
  const profit = revenue-cost;
  const txCount = filtered.length;

  const productAgg = {};
  filtered.forEach(t=> t.items.forEach(it=>{ productAgg[it.name]=(productAgg[it.name]||0)+it.qty; }));
  const topProducts = Object.entries(productAgg).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const staffPay = DB.staff.filter(s=>s.role==='staff').map(s=>{
    const recs = DB.attendance.filter(a=>a.username===s.username && a.clockOut && rangeFilter(STATE.reportRange)({timestamp:a.clockIn}));
    const hrs = recs.reduce((sum,a)=> sum+(a.clockOut-a.clockIn)/3600000,0);
    return {name:s.name, hrs, pay:hrs*s.hourlyRate};
  });

  return `
  <h2 class="section-title">Laporan Penjualan</h2>
  <div class="pill-row">
    <button class="pill ${STATE.reportRange==='today'?'active':''}" data-range="today">Hari Ini</button>
    <button class="pill ${STATE.reportRange==='week'?'active':''}" data-range="week">7 Hari Terakhir</button>
    <button class="pill ${STATE.reportRange==='month'?'active':''}" data-range="month">Bulan Ini</button>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="lbl">Total Pendapatan</div><div class="val">${rp(revenue)}</div></div>
    <div class="stat-card"><div class="lbl">Total Modal (COGS)</div><div class="val">${rp(cost)}</div></div>
    <div class="stat-card"><div class="lbl">Estimasi Untung</div><div class="val">${rp(profit)}</div></div>
    <div class="stat-card"><div class="lbl">Jumlah Transaksi</div><div class="val">${txCount}</div></div>
  </div>
  <div class="grid-2" style="grid-template-columns:1.3fr 1fr">
    <div class="card">
      <h3 style="margin-top:0">Produk Terlaris</h3>
      <canvas id="topChart" height="220"></canvas>
    </div>
    <div class="card">
      <h3 style="margin-top:0">Pendapatan Staff (per jam kerja)</h3>
      <table><thead><tr><th>Staff</th><th>Jam</th><th>Pendapatan</th></tr></thead>
      <tbody>${staffPay.map(s=>`<tr><td>${s.name}</td><td>${s.hrs.toFixed(1)}</td><td>${rp(s.pay)}</td></tr>`).join('') || '<tr><td colspan="3" style="color:var(--ink-soft)">Belum ada data.</td></tr>'}</tbody></table>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3 style="margin-top:0">Transaksi Terbaru</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>No.</th><th>Waktu</th><th>Kasir</th><th>Metode</th><th>Total</th></tr></thead>
      <tbody>${filtered.slice().reverse().slice(0,20).map(t=>`<tr><td>${t.id}</td><td>${fmtDateTime(t.timestamp)}</td><td>${t.cashier}</td><td>${t.payment.toUpperCase()}</td><td>${rp(t.total)}</td></tr>`).join('') || '<tr><td colspan="5" style="color:var(--ink-soft)">Belum ada transaksi.</td></tr>'}</tbody>
    </table></div>
  </div>`;
}
function attachLaporanEvents(){
  document.querySelectorAll('[data-range]').forEach(b=> b.onclick=()=>{ STATE.reportRange=b.dataset.range; renderTabContent(); });
  const ctx = document.getElementById('topChart');
  if(ctx){
    const filtered = DB.transactions.filter(rangeFilter(STATE.reportRange));
    const productAgg = {};
    filtered.forEach(t=> t.items.forEach(it=>{ productAgg[it.name]=(productAgg[it.name]||0)+it.qty; }));
    const top = Object.entries(productAgg).sort((a,b)=>b[1]-a[1]).slice(0,6);
    if(salesChartInstance) salesChartInstance.destroy();
    salesChartInstance = new Chart(ctx, {
      type:'bar',
      data:{ labels: top.map(x=>x[0]), datasets:[{ label:'Terjual', data: top.map(x=>x[1]), backgroundColor:'#C0392B', borderRadius:6 }] },
      options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0}}} }
    });
  }
}

/* ============ STAFF (owner) ============ */
function renderStaff(){
  const rows = DB.staff.map(s=>`
    <tr><td>${s.name}</td><td>${s.username}</td><td>${s.role}</td><td>${rp(s.hourlyRate)}</td>
    <td style="white-space:nowrap">
      <button class="btn btn-sm btn-outline" data-editstaff="${s.username}">Edit</button>
      ${s.username!==STATE.session.username? `<button class="btn btn-sm btn-outline" data-delstaff="${s.username}">Hapus</button>`:''}
    </td></tr>`).join('');
  return `
  <h2 class="section-title">Manajemen Staff</h2>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Daftar Staff</h3>
      <button class="btn btn-sm btn-primary" id="addStaffBtn">+ Tambah Staff</button>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Upah/Jam</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}
function attachStaffEvents(){
  const addBtn = document.getElementById('addStaffBtn');
  if(addBtn) addBtn.onclick = ()=>{ STATE.modal={type:'staffForm',data:{}}; render(); };
  document.querySelectorAll('[data-editstaff]').forEach(b=> b.onclick=()=>{
    const s = DB.staff.find(x=>x.username===b.dataset.editstaff);
    STATE.modal={type:'staffForm',data:{staff:s}}; render();
  });
  document.querySelectorAll('[data-delstaff]').forEach(b=> b.onclick=()=>{
    if(confirm('Hapus staff ini?')){
      DB.staff = DB.staff.filter(s=>s.username!==b.dataset.delstaff);
      save('staff'); renderTabContent();
    }
  });
}

/* ============ AUTO CHECK RENTAL DUE (background) ============ */
setInterval(()=>{
  if(STATE.session && STATE.tab==='sewa'){ renderTabContent(); }
}, 20000);

/* ============ INIT ============ */
(async function init(){
  await loadDB();
  render();
})();
</script>
</body>
</html>
